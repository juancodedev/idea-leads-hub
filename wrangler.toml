name = "idea-leads-hub-1"
main = ".open-next/worker.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
NEXT_PUBLIC_SUPABASE_URL = "https://xsqyftoblnsjkavhldcm.supabase.co"
# WARNING: Hardcoded ANON_KEY removed. Set via Cloudflare dashboard:
# Settings → Variables → Add `NEXT_PUBLIC_SUPABASE_ANON_KEY` and `NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY`
# NEXT_PUBLIC_SUPABASE_ANON_KEY = "<your-anon-key>"
# NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY = "<your-publishable-key>"

# Instagram/Meta Integration — set via Cloudflare dashboard → Settings → Variables:
# META_APP_ID = "<your-meta-app-id>"
# META_APP_SECRET = "<your-meta-app-secret>"
# META_VERIFY_TOKEN = "<your-webhook-verify-token>"
# TOKEN_ENCRYPTION_KEY = "<32-char-aes-key-for-pgcrypto>"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1